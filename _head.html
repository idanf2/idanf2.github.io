<link rel="preload" as="image" href="img/headshot.jpg">
<link rel="preload" as="image" href="img/book.jpg">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400&display=swap" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // External links open in new tab
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });

    // Tab navigation
    var tabs = document.querySelectorAll('.tab-btn');
    var panels = document.querySelectorAll('.content-panel');
    var siteName = document.querySelector('.site-name');
    var activePanel = 'welcome';

    function showPanel(panelName) {
      panels.forEach(function(p) {
        if (p.dataset.panel === panelName) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
      tabs.forEach(function(t) {
        if (t.dataset.tab === panelName) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });
      activePanel = panelName;
      window.scrollTo(0, 0);
    }

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var tabName = tab.dataset.tab;
        if (activePanel === tabName) {
          showPanel('welcome');
        } else {
          showPanel(tabName);
        }
      });
    });

    if (siteName) {
      siteName.addEventListener('click', function() {
        showPanel('welcome');
      });
    }

    // Align photo dimensions to left column height (preserving natural aspect)
    function alignPhoto() {
      var leftCol = document.querySelector('.left-col');
      var photo = document.querySelector('.hero-photo');
      var rightCol = document.querySelector('.right-col');
      if (!leftCol || !photo || !rightCol) return;

      if (window.innerWidth < 900) {
        photo.style.width = '';
        photo.style.height = '';
        rightCol.style.width = '';
        document.documentElement.style.removeProperty('--photo-width');
        return;
      }

      if (!photo.naturalWidth || !photo.naturalHeight) return;

      var height = leftCol.getBoundingClientRect().height;
      var aspect = photo.naturalWidth / photo.naturalHeight;
      var width = Math.round(height * aspect);

      photo.style.width = width + 'px';
      photo.style.height = Math.round(height) + 'px';
      rightCol.style.width = width + 'px';
      document.documentElement.style.setProperty('--photo-width', width + 'px');
    }

    var photoEl = document.querySelector('.hero-photo');
    if (photoEl) {
      if (photoEl.complete && photoEl.naturalWidth) {
        alignPhoto();
      } else {
        photoEl.addEventListener('load', alignPhoto);
      }
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(alignPhoto);
    }

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(alignPhoto, 100);
    });

    // Back-to-top button
    var backToTop = document.querySelector('.back-to-top');
    var scrollThreshold = 300;

    function toggleBackToTop() {
      if (window.scrollY > scrollThreshold) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    }

    if (backToTop) {
      window.addEventListener('scroll', toggleBackToTop, { passive: true });
      toggleBackToTop();

      backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  });
</script>
