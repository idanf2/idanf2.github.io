<link rel="preload" as="image" href="img/headshot.jpg">
<link rel="preload" as="image" href="img/book.jpg">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400&display=swap" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // External links open in new tab
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });

    // Swap sidebar photo: book cover on book tab, headshot elsewhere
    function updatePhoto(panelName) {
      var photo = document.querySelector('.hero-photo');
      if (!photo) return;
      if (panelName === 'book') {
        photo.src = 'img/book.jpg';
        photo.alt = 'Cover of The Emerging Republican Minorities';
      } else {
        photo.src = 'img/headshot.jpg';
        photo.alt = 'Idan Franco';
      }
    }

    // Tab navigation
    var tabs = document.querySelectorAll('.tab-btn');
    var panels = document.querySelectorAll('.content-panel');
    var siteName = document.querySelector('.site-name');
    var activePanel = 'welcome';

    function showPanel(panelName) {
      panels.forEach(function(p) {
        if (p.dataset.panel === panelName) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
      tabs.forEach(function(t) {
        if (t.dataset.tab === panelName) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });
      activePanel = panelName;
      updatePhoto(panelName);
      window.scrollTo(0, 0);
    }

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var tabName = tab.dataset.tab;
        if (activePanel === tabName) {
          showPanel('welcome');
        } else {
          showPanel(tabName);
        }
      });
    });

    if (siteName) {
      siteName.addEventListener('click', function() {
        showPanel('welcome');
      });
    }

    // Back-to-top button
    var backToTop = document.querySelector('.back-to-top');
    var scrollThreshold = 300;

    function toggleBackToTop() {
      if (window.scrollY > scrollThreshold) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    }

    if (backToTop) {
      window.addEventListener('scroll', toggleBackToTop, { passive: true });
      toggleBackToTop();

      backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  });
</script>
