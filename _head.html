<link rel="preload" as="image" href="img/headshot.jpg">
<link rel="preload" as="image" href="img/book.jpg">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400&display=swap" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // External links open in new tab
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });

    // Tab navigation: click tab shows its panel; click active tab or name shows welcome
    var tabs = document.querySelectorAll('.tab-btn');
    var panels = document.querySelectorAll('.content-panel');
    var siteName = document.querySelector('.site-name');
    var activePanel = 'welcome';

    function showPanel(panelName) {
      panels.forEach(function(p) {
        if (p.dataset.panel === panelName) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
      tabs.forEach(function(t) {
        if (t.dataset.tab === panelName) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });
      activePanel = panelName;
    }

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var tabName = tab.dataset.tab;
        if (activePanel === tabName) {
          showPanel('welcome');
        } else {
          showPanel(tabName);
        }
      });
    });

    if (siteName) {
      siteName.addEventListener('click', function() {
        showPanel('welcome');
      });
    }
  });
</script>
