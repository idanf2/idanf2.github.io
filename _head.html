<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400&display=swap" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Open external http(s) links in a new tab
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });

    // Accordion: when one <details> opens, auto-close the others
    var accordions = document.querySelectorAll('details.accordion-item');
    accordions.forEach(function(item) {
      item.addEventListener('toggle', function() {
        if (this.open) {
          accordions.forEach(function(other) {
            if (other !== item && other.open) {
              other.open = false;
            }
          });
        }
      });
    });
  });
</script>
