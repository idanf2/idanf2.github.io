<meta name="view-transition" content="same-origin">
<link rel="preload" as="image" href="img/headshot.jpg">
<link rel="prefetch" href="publications.html">
<link rel="prefetch" href="book.html">
<link rel="prefetch" href="research.html">
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Mark non-home pages so CSS can hide the photo on mobile
    var path = window.location.pathname;
    var isHome = path === '/' || path === '/index.html' || path.endsWith('/index.html') || /^\/?$/.test(path);
    if (!isHome) {
      document.body.classList.add('not-home');
    }

    // Open external http(s) links in a new tab
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });
  });
</script>
