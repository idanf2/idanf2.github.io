<link rel="preload" as="image" href="img/headshot.jpg">
<link rel="preload" as="image" href="img/book.jpg">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,400&display=swap" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Open external http(s) links in a new tab
    document.querySelectorAll('a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//i.test(href) && href.indexOf(location.hostname) === -1) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });

    // Accordion: auto-close others, then scroll opened tab into view
    var accordions = document.querySelectorAll('details.accordion-item');
    accordions.forEach(function(item) {
      item.addEventListener('toggle', function() {
        if (this.open) {
          // Close other open tabs
          accordions.forEach(function(other) {
            if (other !== item && other.open) {
              other.open = false;
            }
          });
          // Scroll this tab's summary near the top of the viewport
          // (offset accounts for navbar height)
          var navbar = document.querySelector('.navbar');
          var navbarHeight = navbar ? navbar.offsetHeight : 70;
          var offset = navbarHeight + 16;
          var y = item.getBoundingClientRect().top + window.pageYOffset - offset;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      });
    });
  });
</script>
